<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon.png" />
<title>Momentum Scanner</title>
<style>
  html,body{margin:0;padding:0;background:#0A0E13;color:#7E8C9A;font-family:system-ui,sans-serif;overscroll-behavior:none}
  #boot{padding:40px 20px;font-size:14px}
  #errbox{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:999;background:#2A0F14;
    border:1px solid #F6465D;color:#F6465D;border-radius:8px;padding:10px 12px;
    font:11px ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div id="root"><div id="boot">Loading scanner…</div></div>
<div id="errbox"></div>

    var b=document.getElementById("errbox"); b.style.display="block";

  });
</script>
