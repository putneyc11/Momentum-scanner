name: Momentum
options:
  bundleIdPrefix: com.momentum
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "66HLLH4YED"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    MOMENTUM_SERVER_URL: ""
    OIDC_ISSUER: ""
    OIDC_CLIENT_ID: ""
    OIDC_AUDIENCE: ""
targets:
  Momentum:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.momentumscanner.app.auth
            CFBundleURLSchemes:
              - com.momentumscanner.app
        MomentumServerURL: $(MOMENTUM_SERVER_URL)
        OIDCIssuer: $(OIDC_ISSUER)
        OIDCClientID: $(OIDC_CLIENT_ID)
        OIDCAudience: $(OIDC_AUDIENCE)
        OIDCRedirectURI: com.momentumscanner.app://auth/callback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momentumscanner.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Momentum
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      configs:
        Debug:
          INFOPLIST_FILE: Configuration/Info.Debug.plist
  MomentumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Momentum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MomentumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Momentum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Momentum:
    build:
      targets:
        Momentum: all
        MomentumTests: [test]
        MomentumUITests: [test]
    test:
      targets:
        - MomentumTests
        - MomentumUITests
