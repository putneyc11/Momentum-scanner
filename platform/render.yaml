# Review paid resources before creating this stack. It does not modify the old services.
# In the existing Momentum-scanner repository, this folder is committed as platform/.
# Set Blueprint Path to platform/render.yaml in Render.
previews:
  generation: off

services:
  - type: web
    name: momentum-algo-v2
    branch: codex/momentum-platform-rebuild
    runtime: node
    region: oregon
    plan: starter
    rootDir: platform
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: paper
      - key: SERVICE_ROLE
        value: api
      - key: WEB_PRODUCT
        value: trader
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: momentum-state-v2
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

  - type: web
    name: momentum-scanner-v2
    branch: codex/momentum-platform-rebuild
    runtime: node
    region: oregon
    plan: starter
    rootDir: platform
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: paper
      - key: SERVICE_ROLE
        value: api
      - key: WEB_PRODUCT
        value: scanner
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: momentum-state-v2
          property: connectionString
      - key: ADMIN_TOKEN
        fromService:
          name: momentum-algo-v2
          type: web
          envVarKey: ADMIN_TOKEN
      - key: SESSION_SECRET
        generateValue: true

  - type: worker
    name: momentum-market-v2
    branch: codex/momentum-platform-rebuild
    runtime: node
    region: oregon
    plan: starter
    rootDir: platform
    buildCommand: npm ci --include=dev && npm run build -w @momentum/engine && npm run build -w @momentum/api
    startCommand: npm run worker
    autoDeployTrigger: off
    numInstances: 1
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: paper
      - key: SERVICE_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: momentum-state-v2
          property: connectionString
      - key: APCA_API_KEY_ID
        sync: false
      - key: APCA_API_SECRET_KEY
        sync: false
      - key: ALPACA_DATA_FEED
        value: sip
      - key: PAPER_TRADING_ENABLED
        value: "false"
      - key: DAILY_LOSS_LIMIT_PCT
        value: "3"
      - key: RISK_PER_TRADE_PCT
        value: "0.25"
      - key: MAX_OPEN_POSITIONS
        value: "4"
      - key: RESEARCH_HOUR_ET
        value: "21"

databases:
  - name: momentum-state-v2
    region: oregon
    plan: basic-256mb
    databaseName: momentum
    user: momentum
    postgresMajorVersion: "17"
    ipAllowList: []
