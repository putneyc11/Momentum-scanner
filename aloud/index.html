/* ============ tokens ============ */
:root{
  --yellow:#FFC907;
  --yellow-hi:#FFD84D;
  --yellow-lo:#EBAF00;
  --yellow-deep:#C79400;
  --ink:#161409;
  --ink-soft:rgba(22,20,9,.74);
  --smoke:#1B1A15;
  --smoke-deep:#12110D;
  --paper:#F4EFDF;
  --paper-dim:#E4DcC6;
  --dim-text:#A29A82;
  --live-text:#F7F3E6;
  --red:#E23B22;
  --key:#26241D;
  --key-hi:#3A372C;
  --label-font:'Michroma',system-ui,sans-serif;
  --hand-font:'Caveat',cursive;
  --read-font:Georgia,'Times New Roman',serif;
  --read-size:19px;
  --bezel:2px solid #B98F00;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#232019;
  font-family:var(--label-font);
  color:var(--ink);
  overflow:hidden;
  overscroll-behavior:none;
}

/* ============ the device ============ */
#device{
  position:relative;
  height:100dvh;
  max-width:460px;
  margin:0 auto;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#FFD21E 0%,#F9C303 46%,#F0B500 100%);
  box-shadow:0 18px 60px rgba(0,0,0,.55);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
@media (min-width:500px){
  #device{border-radius:26px;height:min(92dvh,900px);margin-top:max(2vh,12px)}
}

/* screws */
.screw{position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFE38A,#D9A900 60%,#9C7800);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.35);z-index:5}
.screw::after{content:"";position:absolute;left:1.5px;right:1.5px;top:50%;height:1.4px;
  margin-top:-0.7px;background:rgba(60,44,0,.75);transform:rotate(38deg)}
.screw.tl{top:calc(8px + env(safe-area-inset-top));left:9px}
.screw.tr{top:calc(8px + env(safe-area-inset-top));right:9px}
.screw.bl{bottom:calc(8px + env(safe-area-inset-bottom));left:9px}
.screw.br{bottom:calc(8px + env(safe-area-inset-bottom));right:9px}

/* ============ brand bar ============ */
#brandbar{
  flex:none;display:flex;align-items:baseline;gap:10px;
  padding:12px 26px 8px;
}
#brandbar h1{
  font-size:17px;letter-spacing:.14em;font-weight:400;
  color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.4);
}
#brandbar .model{
  font-size:6.5px;letter-spacing:.22em;color:var(--ink-soft);
  text-shadow:0 1px 0 rgba(255,255,255,.3);
  transform:translateY(-1px);
}
#brandbar .stereo{
  margin-left:auto;font-size:6.5px;letter-spacing:.3em;color:var(--ink-soft);
  border:1px solid rgba(22,20,9,.45);border-radius:2px;padding:3px 5px 2px 7px;
}

/* ============ smoke window ============ */
#window{
  flex:1;min-height:0;
  margin:2px 12px 10px;
  border-radius:16px;
  border:var(--bezel);
  background:linear-gradient(180deg,var(--smoke) 0%,var(--smoke-deep) 100%);
  box-shadow:
    inset 0 2px 10px rgba(0,0,0,.75),
    inset 0 -1px 0 rgba(255,255,255,.06),
    0 1px 0 rgba(255,255,255,.35);
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}
/* glass glare */
#window::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;
  background:linear-gradient(115deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.02) 24%,transparent 36%);
}

/* ============ cassette ============ */
#cassette{
  flex:none;
  margin:14px 16px 10px;
  border-radius:9px;
  background:linear-gradient(180deg,#333026 0%,#262319 100%);
  border:1px solid #474334;
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09);
  padding:8px 12px 9px;
  position:relative;
  transition:transform .12s cubic-bezier(.2,.8,.3,1);
  cursor:pointer;
}
#cassette.clunk{transform:translateY(3px)}
#cassette .c-screw{position:absolute;width:5px;height:5px;border-radius:50%;
  background:#0E0D09;box-shadow:inset 0 1px 1px rgba(255,255,255,.15)}
#cassette .c-screw:nth-child(1){top:5px;left:6px}
#cassette .c-screw:nth-child(2){top:5px;right:6px}
#cassette .c-screw:nth-child(3){bottom:5px;left:6px}
#cassette .c-screw:nth-child(4){bottom:5px;right:6px}

#tape-label{
  background:linear-gradient(180deg,var(--paper) 0%,#EAE4CF 100%);
  border-radius:4px;
  padding:2px 10px 3px;
  box-shadow:0 1px 2px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:8px;
  border-top:3px solid var(--red);
  min-height:34px;
}
#tape-title{
  font-family:var(--hand-font);font-size:21px;line-height:1.1;color:#242015;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  font-weight:600;
}

/* empty state */

/* ============ deck ============ */
#deck{flex:none;padding:0 14px 12px}

/* LCD status strip */
#lcd{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#2E2B1E,#232013);
  border-radius:7px;border:1px solid #9C7800;

  padding:7px 12px;margin-bottom:10px;
  font-size:9px;letter-spacing:.14em;color:#E8DFA9;
  min-height:32px;
}
#lamp{width:8px;height:8px;border-radius:50%;flex:none;
  background:#4A2018;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);

#lamp.on{background:var(--red);box-shadow:0 0 8px rgba(226,59,34,.9),inset 0 1px 1px rgba(255,255,255,.4)}
#lcd .sep{opacity:.35}
#counter{font-variant-numeric:tabular-nums}
#lcd-msg{flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#C9BE8B}

/* speed fader */
#speedrow{margin-bottom:10px;padding:0 4px}
#speedrow .fader-labels{
  display:flex;justify-content:space-between;
  font-size:6.5px;letter-spacing:.1em;color:var(--ink-soft);
  padding:0 2px;margin-bottom:2px;
  text-shadow:0 1px 0 rgba(255,255,255,.3);
}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;
}
input[type=range]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:3px;
  background:linear-gradient(180deg,#B98F00,#8F6E00);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.35);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:30px;height:20px;border-radius:4px;margin-top:-7px;
  background:linear-gradient(180deg,var(--key-hi),var(--key));
  border:1px solid #0E0D09;
  box-shadow:0 3px 5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);

}
input[type=range]::-moz-range-track{
  height:6px;border-radius:3px;background:linear-gradient(180deg,#B98F00,#8F6E00);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
}
input[type=range]::-moz-range-thumb{
  width:30px;height:20px;border-radius:4px;border:1px solid #0E0D09;
  background:linear-gradient(180deg,var(--key-hi),var(--key));

}

/* transport keys */
#transport{display:flex;gap:8px;align-items:stretch}
.key{
  appearance:none;border:1px solid #0E0D09;border-radius:8px;
  background:linear-gradient(180deg,var(--key-hi) 0%,var(--key) 55%,#1C1A14 100%);

  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:10px 6px 8px;

}
.key:active,.key.pressed{

.key:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.key svg{display:block}
.key .klabel{font-size:6.5px;letter-spacing:.2em;color:#B9B29C}
.key.small{flex:1}
.key.wide{flex:1.7}
#btn-play svg .glyph{fill:var(--yellow)}

/* settings door */
#door-handle{
  margin:10px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;
  appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:var(--label-font);font-size:6.5px;letter-spacing:.26em;color:var(--ink-soft);
  padding:6px 20px 2px;
  text-shadow:0 1px 0 rgba(255,255,255,.3);
}
#door-handle:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
#door-handle .ridge{width:34px;height:5px;border-radius:3px;
  background:repeating-linear-gradient(90deg,#D9A900 0 3px,#F5C819 3px 6px);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}
#door{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .3s cubic-bezier(.2,.9,.25,1);
}
#door.open{grid-template-rows:1fr}
#door>.door-clip{overflow:hidden;min-height:0}
#door .door-inner{
  margin-top:8px;border-radius:10px;
  background:linear-gradient(180deg,#EFBB00,#E0AC00);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.18),inset 0 -1px 0 rgba(255,255,255,.25);
  padding:12px 14px;
  display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;
}
#door label{font-size:6.5px;letter-spacing:.2em;color:var(--ink-soft);display:block;margin-bottom:5px}
#door .field-voice{grid-column:1/-1}
select,#door .stepper{
  width:100%;appearance:none;-webkit-appearance:none;
  font-family:var(--label-font);font-size:10px;letter-spacing:.05em;color:var(--ink);
  background:var(--paper);
  border:1px solid #0E0D09;border-radius:6px;
  padding:9px 10px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.15);
}
select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.field-voice-wrap{position:relative}
.field-voice-wrap::after{content:"";position:absolute;right:11px;top:50%;margin-top:-2px;
  border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink);
  pointer-events:none}
#door .stepper{display:flex;align-items:center;justify-content:space-between;padding:4px 4px}
#door .stepper button{
  appearance:none;border:1px solid #0E0D09;border-radius:4px;width:30px;height:26px;
  background:linear-gradient(180deg,var(--key-hi),var(--key));color:#EDE8D8;
  font-family:var(--label-font);font-size:11px;cursor:pointer;
  box-shadow:0 2px 3px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
}
#door .stepper button:active{transform:translateY(1px);box-shadow:0 0 1px rgba(0,0,0,.3)}
#door .stepper .val{font-size:9px;letter-spacing:.08em}

/* ============ sheets ============ */
#backdrop{

}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:30;

}

}

.sheet .x:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.sheet .body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 22px}

/* tape box list */
.tapeitem{
  display:flex;align-items:center;gap:0;
  border-radius:8px;margin-bottom:10px;
  background:linear-gradient(180deg,#333026,#262319);
  border:1px solid #474334;

}
.tapeitem .load{

}
.tapeitem .load:focus-visible{outline:2px solid var(--yellow);outline-offset:-3px;border-radius:6px}
.tapeitem .t-label{
  background:linear-gradient(180deg,var(--paper),#EAE4CF);
  border-radius:3px;border-top:2px solid var(--red);
  padding:1px 9px 2px;margin-bottom:6px;
  box-shadow:0 1px 2px rgba(0,0,0,.4);
}
.tapeitem .t-title{
  font-family:var(--hand-font);font-size:19px;font-weight:600;color:#242015;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tapeitem .t-meta{font-size:7px;letter-spacing:.16em;color:#9C957E;display:flex;gap:10px;align-items:center}
.tapeitem .t-fill{
  height:3px;border-radius:2px;background:#191712;flex:1;max-width:120px;overflow:hidden;
}
.tapeitem .t-fill i{display:block;height:100%;background:var(--yellow);border-radius:2px}
.tapeitem .del{
  appearance:none;border:0;border-left:1px solid rgba(244,239,223,.1);
  background:transparent;color:#8A836D;cursor:pointer;
  align-self:stretch;width:44px;display:flex;align-items:center;justify-content:center;
}
.tapeitem .del:focus-visible,.tapeitem .del:hover{color:var(--red);outline:none}
.tapeitem.now{border-color:var(--yellow-deep)}
.tapeitem.now .t-meta .nowtag{color:var(--yellow)}
.box-empty{padding:30px 10px;text-align:center;font-size:9px;letter-spacing:.2em;color:#8A836D;line-height:2.2}

/* new tape form */
#newsheet .body{display:flex;flex-direction:column;gap:12px}
#newsheet label{font-size:7px;letter-spacing:.24em;color:#B9B29C;display:block;margin-bottom:6px}
#f-title,#f-text{
  width:100%;font-family:var(--hand-font);color:#242015;
  background:linear-gradient(180deg,var(--paper),#EDE7D3);
  border:1px solid #0E0D09;border-radius:7px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.2);
  padding:8px 12px;
}
#f-title{font-size:21px;font-weight:600}
#f-text{
  font-size:18px;line-height:1.5;resize:none;min-height:32dvh;
  background-image:repeating-linear-gradient(180deg,transparent 0 26px,rgba(90,80,50,.18) 26px 27px);
}
#f-title:focus-visible,#f-text:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#newsheet .btnrow{display:flex;gap:8px}
.key.paper-key{
  background:linear-gradient(180deg,var(--yellow-hi),var(--yellow) 55%,var(--yellow-lo));
  color:var(--ink);min-height:48px;flex:1.6;
  box-shadow:0 4px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 3px rgba(0,0,0,.18);
}
.key.paper-key .klabel{color:var(--ink-soft)}
.key.ghost-key{flex:1;min-height:48px}
#f-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* misc */
[hidden]{display:none!important}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

  #reelbox{margin-top:5px}
  .key{min-height:54px}
  :root{--read-size:17px}
}

<body>
<!--
THESIS: a text-to-speech reader played as a pocket tape machine — the one idea this
surface owns is "your text is a cassette": documents are tapes with handwritten labels,
playback is mechanical transport keys, and the voice's position is visible as karaoke
word-light behind smoke glass. It refuses the category default: the white SaaS reader
with a purple gradient play button.
OWN-WORLD: sport-walkman molded yellow plastic (#FFC907) as the whole chassis; smoke
window (#1B1A15) holding cassette + text; cream label stickers with a red stripe;
charcoal mechanical keys with embossed Michroma micro-caps; handwritten Caveat tape
labels; one red RUN lamp; amber LCD strip.
STORY: the owner drops text in, sees it become a labelled tape, presses PLAY, and
follows the lit word; they skip by sentence with REW/FF and swap tapes from the box.
FIRST VIEWPORT: full-screen device — brand strip, then the smoke window (cassette with
spinning reels atop the scrolling follow-along text), then LCD counter, speed fader and
five transport keys at the thumb.
FORM: portable cassette player / walkman — candidate 3 of 7 on the ordered list; seed
key 5259b522 (degraded roll, no challengers).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
review, the verdict, and DESIGN.md.
-->

<section class="sheet" id="newsheet" aria-label="New tape" role="dialog" aria-modal="true">
  <header>
    <svg width="15" height="15" viewBox="0 0 17 17" aria-hidden="true"><path d="M8.5 2v13M2 8.5h13" stroke="#EDE8D8" stroke-width="2.6" stroke-linecap="round"/></svg>
    <h2>NEW TAPE</h2>
    <button class="x" data-close aria-label="Close new tape">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="body">
    <div>
      <label for="f-title">LABEL (OPTIONAL)</label>
      <input id="f-title" type="text" autocomplete="off" spellcheck="false" placeholder="Untitled tape">
    </div>
    <div style="flex:1;display:flex;flex-direction:column">
      <label for="f-text">TEXT TO READ</label>
      <textarea id="f-text" placeholder="Paste or type anything here — an article, notes, a chapter…"></textarea>
    </div>
    <div class="btnrow">
      <button class="key ghost-key" id="btn-pastein">
        <span class="klabel">PASTE</span>
      </button>
      <button class="key ghost-key" id="btn-file">
        <span class="klabel">LOAD .TXT</span>
      </button>
      <input type="file" id="f-file" accept=".txt,.md,.text,text/plain">
      <button class="key paper-key" id="btn-make">
        <svg width="16" height="16" viewBox="0 0 20 18" aria-hidden="true"><path fill="currentColor" d="M4 2l13 7-13 7V2Z"/></svg>
        <span class="klabel">MAKE &amp; PLAY</span>
      </button>
    </div>
  </div>
</section>

<script>
'use strict';
/* ================================================================
   Aloud — a local, offline text-to-speech reader (Web Speech API)
   ================================================================ */

const $ = s => document.querySelector(s);
const SPEEDS = [0.5,0.75,1,1.25,1.5,2,2.5,3];
const LS_DOCS='aloud.docs.v1', LS_SET='aloud.settings.v1', LS_CUR='aloud.current.v1';
const WPM=170;                      // rough speech words-per-minute at 1×
const MAX_WORD_SPANS=20000;         // above this, highlight sentences only

/* ---------- storage ---------- */
const store={
  load(k,fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } },
  save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ toast('STORAGE FULL — TAPE NOT SAVED'); } }
};
let docs   = store.load(LS_DOCS,[]);
let settings = Object.assign({speedIdx:2,pitch:1,voiceURI:null,textSize:19}, store.load(LS_SET,{}));
let currentId = store.load(LS_CUR,null);

/* ---------- text segmentation ---------- */
function segment(text){
  // paragraphs → sentences → words, all with absolute offsets
  const paras=[]; const sentences=[];
  const parts=text.split(/\n{1,}/);
  let off=0;
  for(const part of parts){
    const start=off; off+=part.length+1; // +1 for the split \n (approx; offsets are per-doc informational)
    const trimmed=part.trim();
    if(!trimmed){ continue; }
    const paraSentences=[];
    const re=/[^.!?…]+(?:[.!?…]+["'")\]]*|$)\s*/g;
    let m;
    while((m=re.exec(part))!==null){
      let s=m[0];
      if(!s.trim()) continue;
      // split over-long chunks so speech engines stay reliable
      let chunkStart=m.index;
      while(s.length>280){
        let cut=s.lastIndexOf(', ',240);
        if(cut<80) cut=s.lastIndexOf(' ',240);
        if(cut<80) cut=240;
        pushSentence(s.slice(0,cut+1),start+chunkStart,paraSentences,sentences);
        s=s.slice(cut+1); chunkStart+=cut+1;
      }
      pushSentence(s,start+chunkStart,paraSentences,sentences);
    }
    if(paraSentences.length) paras.push(paraSentences);
  }
  return {paras,sentences};
}
function pushSentence(raw,absStart,paraArr,all){
  const text=raw.replace(/\s+$/,'');
  if(!text) return;
  const words=[];
  const wre=/\S+/g; let w;
  while((w=wre.exec(text))!==null) words.push({start:w.index,end:w.index+w[0].length});
  const s={text,words,idx:all.length};
  paraArr.push(s); all.push(s);
}

/* ---------- reels (SVG) ---------- */
function buildReel(svg){
  const NS='http://www.w3.org/2000/svg';
  const g=document.createElementNS(NS,'g');
  g.setAttribute('transform-origin','23 23');
  const spool=document.createElementNS(NS,'circle');
  spool.setAttribute('cx',23);spool.setAttribute('cy',23);spool.setAttribute('r',10.5);
  spool.setAttribute('fill','none');spool.setAttribute('stroke','#4A3826');
  svg.appendChild(spool);
  const hub=document.createElementNS(NS,'circle');
  hub.setAttribute('cx',23);hub.setAttribute('cy',23);hub.setAttribute('r',8.5);
  hub.setAttribute('fill','#F4EFDF');
  g.appendChild(hub);
  for(let i=0;i<6;i++){
    const t=document.createElementNS(NS,'rect');
    t.setAttribute('x',21.6);t.setAttribute('y',15.2);t.setAttribute('width',2.8);t.setAttribute('height',5);
    t.setAttribute('rx',1);t.setAttribute('fill','#26231A');
    t.setAttribute('transform',`rotate(${i*60} 23 23)`);
    g.appendChild(t);
  }
  const pin=document.createElementNS(NS,'circle');
  pin.setAttribute('cx',23);pin.setAttribute('cy',23);pin.setAttribute('r',2.2);
  pin.setAttribute('fill','#26231A');
  g.appendChild(pin);
  svg.appendChild(g);
  return {g,spool};
}
const reelL=buildReel($('#reelL')), reelR=buildReel($('#reelR'));
let reelAngle=0, reelSpeed=0, reelTarget=0, lastT=0, reelRAF=null;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function reelLoop(t){
  const dt=Math.min(0.05,(t-lastT)/1000)||0.016; lastT=t;
  reelSpeed+=(reelTarget-reelSpeed)*Math.min(1,dt*4);
  if(Math.abs(reelSpeed)>0.01){
    reelAngle=(reelAngle+reelSpeed*360*dt)%360;
    reelL.g.setAttribute('transform',`rotate(${reelAngle} 23 23)`);
    reelR.g.setAttribute('transform',`rotate(${reelAngle} 23 23)`);
  }
  if(Math.abs(reelSpeed)>0.01||Math.abs(reelTarget)>0.01) reelRAF=requestAnimationFrame(reelLoop);
  else reelRAF=null;
}
function setReels(running){
  reelTarget=running&&!reduceMotion?0.9:0;
  if(!reelRAF&&!reduceMotion){ lastT=performance.now(); reelRAF=requestAnimationFrame(reelLoop); }
}
function setTapeFill(frac){ // tape winds from the left spool onto the right one
  const swL=2+10*(1-frac), swR=2+10*frac;
  reelL.spool.setAttribute('stroke-width',swL);
  reelL.spool.setAttribute('r',10.5+swL/2);
  reelR.spool.setAttribute('stroke-width',swR);
  reelR.spool.setAttribute('r',10.5+swR/2);
}
setTapeFill(0);

/* ---------- player ---------- */
const synth=window.speechSynthesis;
const player={
  doc:null, seg:null, cur:0, playing:false, stopping:false,
  lastWordStart:0,           // char offset within current sentence for resume
  boundarySeen:false, sentencesWithoutBoundary:0, wordMode:true,
  utter:null, wakeLock:null,

  loadDoc(doc,{autoplay=false}={}){
    this.stop();
    this.doc=doc; this.seg=segment(doc.text);
    this.cur=Math.min(doc.pos||0,Math.max(0,this.seg.sentences.length-1));
    this.lastWordStart=0;
    this.boundarySeen=false; this.sentencesWithoutBoundary=0; this.wordMode=true;
    currentId=doc.id; store.save(LS_CUR,currentId);
    renderDoc(); updateHUD();
    if(autoplay) this.play();
  },
  play(){
    if(!this.doc||!this.seg.sentences.length) return;
    if(!('speechSynthesis' in window)){ toast('NO SPEECH ENGINE IN THIS BROWSER'); return; }
    this.playing=true; this.stopping=false;
    uiPlaying(true);
    // small delay: some engines drop a speak() issued right after cancel()
    const from=this.lastWordStart;
    setTimeout(()=>{ if(this.playing) this.speakCurrent(from); },60);
    this.acquireWake();
  },
  pause(){
    this.playing=false; this.stopping=true;
    try{ synth.cancel(); }catch(e){}
    uiPlaying(false); this.releaseWake(); this.persistPos();
  },
  toggle(){ this.playing?this.pause():this.play(); },
  stop(){
    this.playing=false; this.stopping=true;
    try{ synth.cancel(); }catch(e){}
    uiPlaying(false); this.releaseWake();
  },
  seek(i,{wordStart=0}={}){
    if(!this.seg) return;
    this.cur=Math.max(0,Math.min(i,this.seg.sentences.length-1));
    this.lastWordStart=wordStart;
    highlightSentence(); updateHUD(); this.persistPos();
    if(this.playing){ this.stopping=true; try{synth.cancel();}catch(e){}
      setTimeout(()=>{ if(this.playing) this.speakCurrent(this.lastWordStart); },80);
    }
  },
  rew(){ this.seek(this.lastWordStart>0&&!this.playing?this.cur:this.cur-1); },
  ff(){ this.seek(this.cur+1); },
  restartSentence(){ // after voice/rate/pitch change
    if(this.playing){ this.stopping=true; try{synth.cancel();}catch(e){}
      setTimeout(()=>{ if(this.playing) this.speakCurrent(this.lastWordStart); },80); }
  },
  speakCurrent(fromChar=0){
    const s=this.seg.sentences[this.cur];
    if(!s){ this.finish(); return; }
    this.stopping=false;
    const text=fromChar>0?s.text.slice(fromChar):s.text;
    const u=new SpeechSynthesisUtterance(text);
    u.rate=SPEEDS[settings.speedIdx]; u.pitch=settings.pitch;
    const v=pickVoice(); if(v) u.voice=v;
    const offset=fromChar;
    let sawBoundary=false;
    u.onboundary=e=>{
      if(e.name&&e.name!=='word') return;
      sawBoundary=true; this.boundarySeen=true;
      const abs=offset+e.charIndex;
      const wi=wordAt(s,abs);
      if(wi>=0){ this.lastWordStart=s.words[wi].start; if(this.wordMode) highlightWord(wi); }
    };
    u.onend=()=>{
      if(this.stopping) return;
      if(!sawBoundary){
        this.sentencesWithoutBoundary++;
        if(this.sentencesWithoutBoundary>=2&&!this.boundarySeen&&this.wordMode){
          this.wordMode=false; clearWord();
          toast('WORD SYNC UNAVAILABLE — SENTENCE MODE');
        }
      }
      this.lastWordStart=0;
      this.cur++;
      if(this.cur>=this.seg.sentences.length){ this.finish(); return; }
      highlightSentence(); updateHUD(); this.persistPos();
      this.speakCurrent(0);
    };
    u.onerror=e=>{
      if(this.stopping||e.error==='interrupted'||e.error==='canceled') return;
      this.playing=false; uiPlaying(false); this.releaseWake();
      toast('SPEECH STOPPED — '+String(e.error||'unknown').toUpperCase());
    };
    this.utter=u; // keep a reference (GC bug in some engines)
    highlightSentence();
    try{ synth.speak(u); }catch(e){ toast('COULD NOT START SPEECH'); this.pause(); }
  },
  finish(){
    this.playing=false; uiPlaying(false); this.releaseWake();
    this.cur=0; this.lastWordStart=0; this.persistPos();
    highlightSentence(); updateHUD();
    toast('END OF SIDE A — REWOUND');
  },
  persistPos(){
    if(!this.doc) return;
    this.doc.pos=this.cur; this.doc.updatedAt=Date.now();
    store.save(LS_DOCS,docs);
  },
  async acquireWake(){
    try{ this.wakeLock=await navigator.wakeLock?.request('screen'); }catch(e){}
  },
  releaseWake(){ try{ this.wakeLock?.release(); this.wakeLock=null; }catch(e){} }
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&player.playing) player.acquireWake();
});

function wordAt(s,charIndex){
  for(let i=0;i<s.words.length;i++){
    const w=s.words[i];
    if(charIndex<w.end) return i;
  }
  return s.words.length-1;
}
function pickVoice(){
  const vs=synth.getVoices();
  if(!vs.length) return null;
  if(settings.voiceURI){ const v=vs.find(v=>v.voiceURI===settings.voiceURI); if(v) return v; }
  const lang=(navigator.language||'en').toLowerCase();
  return vs.find(v=>v.default)||vs.find(v=>v.lang.toLowerCase().startsWith(lang))||vs[0];
}

/* ---------- rendering ---------- */
const readerEl=$('#reader'), emptyEl=$('#empty'), cassetteEl=$('#cassette');
let sentenceEls=[], liveWordEl=null, liveSentEl=null;
let userScrolledAt=0;
readerEl.addEventListener('scroll',()=>{ userScrolledAt=Date.now(); },{passive:true});
// programmatic scrolls also fire scroll events; track our own
let programmaticScrollUntil=0;

function renderDoc(){
  const d=player.doc;
  cassetteEl.hidden=false; readerEl.hidden=false; emptyEl.hidden=true;
  $('#tape-title').textContent=d.title;
  const totalWords=player.seg.sentences.reduce((a,s)=>a+s.words.length,0);
  const wordSpans=totalWords<=MAX_WORD_SPANS;
  readerEl.innerHTML='';
  sentenceEls=[];
  const frag=document.createDocumentFragment();
  for(const para of player.seg.paras){
    const p=document.createElement('p');
    for(const s of para){
      const el=document.createElement('span');
      el.className='s'; el.dataset.i=s.idx;
      if(wordSpans){
        let pos=0;
        for(let wi=0;wi<s.words.length;wi++){
          const w=s.words[wi];
          if(w.start>pos) el.appendChild(document.createTextNode(s.text.slice(pos,w.start)));
          const we=document.createElement('span');
          we.className='w'; we.dataset.w=wi;
          we.textContent=s.text.slice(w.start,w.end);
          el.appendChild(we);
          pos=w.end;
        }
        if(pos<s.text.length) el.appendChild(document.createTextNode(s.text.slice(pos)));
      }else{
        el.textContent=s.text;
      }
      p.appendChild(el);
      p.appendChild(document.createTextNode(' '));
      sentenceEls[s.idx]=el;
    }
    frag.appendChild(p);
  }
  readerEl.appendChild(frag);
  highlightSentence(); updateHUD();
}
function highlightSentence(){
  if(liveSentEl) liveSentEl.classList.remove('live');
  clearWord();
  sentenceEls.forEach((el,i)=>el.classList.toggle('done',i<player.cur));
  liveSentEl=sentenceEls[player.cur]||null;
  if(liveSentEl){
    liveSentEl.classList.add('live');
    liveSentEl.classList.remove('done');
    autoScroll();
  }
}
function highlightWord(wi){
  clearWord();
  if(!liveSentEl) return;
  liveWordEl=liveSentEl.querySelector(`.w[data-w="${wi}"]`);
  if(liveWordEl) liveWordEl.classList.add('live');
}
function clearWord(){ if(liveWordEl){liveWordEl.classList.remove('live');liveWordEl=null;} }
function autoScroll(){
  if(!liveSentEl) return;
  // don't fight the reader: skip if they scrolled in the last 4s
  if(Date.now()-userScrolledAt<4000&&Date.now()>programmaticScrollUntil) return;
  programmaticScrollUntil=Date.now()+900;
  liveSentEl.scrollIntoView({block:'center',behavior:reduceMotion?'auto':'smooth'});
}
readerEl.addEventListener('click',e=>{
  const w=e.target.closest('.w'), s=e.target.closest('.s');
  if(!s) return;
  const si=+s.dataset.i;
  const sent=player.seg.sentences[si];
  const wordStart=w?sent.words[+w.dataset.w].start:0;
  const wasPlaying=player.playing;
  player.seek(si,{wordStart});
  if(!wasPlaying) player.play();
});

/* ---------- HUD ---------- */
const lampEl=$('#lamp'), counterEl=$('#counter'), timeleftEl=$('#timeleft'),
      speedRO=$('#speed-readout'), lcdMsg=$('#lcd-msg'), playLabel=$('#play-label');
function pad(n){ return String(n).padStart(3,'0'); }
function updateHUD(){
  if(!player.seg){ counterEl.textContent='000/000'; timeleftEl.textContent='–– MIN'; setTapeFill(0); return; }
  const total=player.seg.sentences.length;
  counterEl.textContent=`${pad(Math.min(player.cur+1,total))}/${pad(total)}`;
  let wordsLeft=0;
  for(let i=player.cur;i<total;i++) wordsLeft+=player.seg.sentences[i].words.length;
  const mins=wordsLeft/(WPM*SPEEDS[settings.speedIdx]);
  timeleftEl.textContent=mins>=1?`${Math.round(mins)} MIN`:`<1 MIN`;
  setTapeFill(total>1?player.cur/(total-1):1);
}
function uiPlaying(on){
  lampEl.classList.toggle('on',on);
  document.querySelector('.gl-play').style.display=on?'none':'';
  document.querySelector('.gl-pause').style.display=on?'':'none';
  playLabel.textContent=on?'PAUSE':'PLAY';
  $('#btn-play').setAttribute('aria-label',on?'Pause':'Play');
  setReels(on);
  if(on){ cassetteEl.classList.add('clunk'); setTimeout(()=>cassetteEl.classList.remove('clunk'),140); }
}
let toastTimer=null;
function toast(msg){
  lcdMsg.textContent=msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ lcdMsg.textContent=''; },4200);
}

/* ---------- controls ---------- */
$('#btn-play').addEventListener('click',()=>{
  if(!player.doc){ openSheet(newsheet); return; }
  player.toggle();
});
$('#btn-rew').addEventListener('click',()=>player.rew());
$('#btn-ff').addEventListener('click',()=>player.ff());
$('#btn-new').addEventListener('click',()=>openSheet(newsheet));
$('#btn-eject').addEventListener('click',()=>{ renderBox(); openSheet(boxsheet); });
$('#btn-first-tape').addEventListener('click',()=>openSheet(newsheet));
cassetteEl.addEventListener('click',()=>{ renderBox(); openSheet(boxsheet); });
cassetteEl.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); renderBox(); openSheet(boxsheet);} });

const speedEl=$('#speed');
speedEl.value=settings.speedIdx;
function applySpeedUI(){ speedRO.textContent=SPEEDS[settings.speedIdx]+'×'; }
applySpeedUI();
speedEl.addEventListener('input',()=>{
  settings.speedIdx=+speedEl.value; store.save(LS_SET,settings);
  applySpeedUI(); updateHUD(); player.restartSentence();
});

/* settings door */
const door=$('#door'), doorHandle=$('#door-handle');
doorHandle.addEventListener('click',()=>{
  const open=!door.classList.contains('open');
  door.classList.toggle('open',open);
  doorHandle.setAttribute('aria-expanded',open);
});
const voiceSel=$('#voice');
function fillVoices(){
  const vs=synth.getVoices();
  voiceSel.innerHTML='';
  if(!vs.length){
    const o=document.createElement('option'); o.textContent='No voices found on this device'; o.value='';
    voiceSel.appendChild(o); return;
  }
  const sorted=[...vs].sort((a,b)=>(b.localService-a.localService)||a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name));
  for(const v of sorted){
    const o=document.createElement('option');
    o.value=v.voiceURI;
    o.textContent=`${v.name} — ${v.lang}${v.localService?'':' (online)'}`;
    voiceSel.appendChild(o);
  }
  const chosen=pickVoice(); if(chosen) voiceSel.value=chosen.voiceURI;
}
fillVoices();
if('onvoiceschanged' in synth) synth.onvoiceschanged=fillVoices;
setTimeout(fillVoices,600);
voiceSel.addEventListener('change',()=>{
  settings.voiceURI=voiceSel.value||null; store.save(LS_SET,settings);
  player.restartSentence();
});
function stepPitch(d){
  settings.pitch=Math.round(Math.min(2,Math.max(0.5,settings.pitch+d))*10)/10;
  $('#pitch-val').textContent=settings.pitch.toFixed(1);
  store.save(LS_SET,settings); player.restartSentence();
}
$('#pitch-dn').addEventListener('click',()=>stepPitch(-0.1));
$('#pitch-up').addEventListener('click',()=>stepPitch(0.1));
$('#pitch-val').textContent=settings.pitch.toFixed(1);
function stepSize(d){
  settings.textSize=Math.min(26,Math.max(14,settings.textSize+d));
  $('#size-val').textContent=settings.textSize;
  document.documentElement.style.setProperty('--read-size',settings.textSize+'px');
  store.save(LS_SET,settings);
}
$('#size-dn').addEventListener('click',()=>stepSize(-1));
$('#size-up').addEventListener('click',()=>stepSize(1));
$('#size-val').textContent=settings.textSize;
document.documentElement.style.setProperty('--read-size',settings.textSize+'px');

/* keyboard (desktop nicety) */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.key===' '){ e.preventDefault(); if(player.doc) player.toggle(); }
  if(e.key==='ArrowLeft') player.rew();
  if(e.key==='ArrowRight') player.ff();
});

/* ---------- sheets ---------- */
const backdrop=$('#backdrop'), boxsheet=$('#boxsheet'), newsheet=$('#newsheet');
let openedSheet=null;
function openSheet(sheet){
  openedSheet=sheet;
  backdrop.classList.add('show');
  sheet.classList.add('open');
}
function closeSheets(){
  backdrop.classList.remove('show');
  boxsheet.classList.remove('open'); newsheet.classList.remove('open');
  openedSheet=null;
}
backdrop.addEventListener('click',closeSheets);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeSheets));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheets(); });

/* tape box */
function estMin(text){ return Math.max(1,Math.round((text.split(/\s+/).length)/WPM)); }
function renderBox(){
  const list=$('#boxlist');
  list.innerHTML='';
  if(!docs.length){
    list.innerHTML='<p class="box-empty">THE BOX IS EMPTY<br>MAKE A TAPE FROM ANY TEXT</p>';
    return;
  }
  const sorted=[...docs].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  for(const d of sorted){
    const total=Math.max(1,(d.sentCount||1));
    const frac=Math.min(1,(d.pos||0)/Math.max(1,total-1));
    const item=document.createElement('div');
    item.className='tapeitem'+(d.id===currentId?' now':'');
    item.innerHTML=
      `<button class="load">
         <span class="t-label"><span class="t-title"></span></span>
         <span class="t-meta"><span>${estMin(d.text)} MIN</span><span class="t-fill"><i style="width:${Math.round(frac*100)}%"></i></span><span class="nowtag">${d.id===currentId?'IN DECK':''}</span></span>
       </button>
       <button class="del" aria-label="Delete tape">
         <svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
       </button>`;
    item.querySelector('.t-title').textContent=d.title;
    item.querySelector('.load').addEventListener('click',()=>{
      closeSheets();
      player.loadDoc(d,{autoplay:true});
    });
    item.querySelector('.del').addEventListener('click',()=>{
      if(!confirm(`Throw away “${d.title}”?`)) return;
      docs=docs.filter(x=>x.id!==d.id);
      store.save(LS_DOCS,docs);
      if(d.id===currentId){ player.stop(); player.doc=null; player.seg=null; player.cur=0; currentId=null; store.save(LS_CUR,null); showEmpty(); }
      renderBox();
    });
    list.appendChild(item);
  }
}
function showEmpty(){
  cassetteEl.hidden=true; readerEl.hidden=true; emptyEl.hidden=false;
  updateHUD();
}

/* new tape */
$('#btn-make').addEventListener('click',()=>{
  const text=$('#f-text').value.trim();
  if(!text){ $('#f-text').focus(); toast('NOTHING TO READ YET'); return; }
  let title=$('#f-title').value.trim();
  if(!title){ title=text.split(/\s+/).slice(0,5).join(' '); if(title.length>34) title=title.slice(0,34)+'…'; }
  const seg=segment(text);
  const doc={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
             title,text,pos:0,sentCount:seg.sentences.length,
             createdAt:Date.now(),updatedAt:Date.now()};
  docs.push(doc); store.save(LS_DOCS,docs);
  $('#f-text').value=''; $('#f-title').value='';
  closeSheets();
  player.loadDoc(doc,{autoplay:true});
});
$('#btn-pastein').addEventListener('click',async()=>{
  try{
    const t=await navigator.clipboard.readText();
    if(t){ $('#f-text').value=($('#f-text').value?$('#f-text').value+'\n\n':'')+t; }
    else toast('CLIPBOARD IS EMPTY');
  }catch(e){ toast('PASTE BLOCKED — LONG-PRESS THE TEXT AREA'); $('#f-text').focus(); }
});
$('#btn-file').addEventListener('click',()=>$('#f-file').click());
$('#f-file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    $('#f-text').value=String(r.result);
    if(!$('#f-title').value) $('#f-title').value=f.name.replace(/\.(txt|md|text)$/i,'');
  };
  r.readAsText(f);
  e.target.value='';
});

/* ---------- share target / URL params ---------- */
(function handleShare(){
  const q=new URLSearchParams(location.search);
  const shared=[q.get('title'),q.get('text'),q.get('url')].filter(Boolean).join('\n\n');
  if(shared){
    $('#f-text').value=q.get('text')||q.get('url')||'';
    $('#f-title').value=q.get('title')||'';
    history.replaceState(null,'',location.pathname);
    setTimeout(()=>openSheet(newsheet),300);
  }
})();

/* ---------- boot ---------- */
const WELCOME_TEXT=[
"Welcome to Aloud, your pocket reading machine. This is side A of your first tape.",
"Here is how it works. Anything you paste into this player becomes a tape: an article, your notes, an email, a chapter of a book. Press the yellow play key and your phone reads it out loud while the words light up, so you can follow along or just close your eyes and listen.",
"The two arrow keys skip back and forward one sentence at a time. The fader under the counter changes the reading speed, from a slow half speed all the way up to triple speed. If you tap any word on this screen, the voice jumps straight to it.",
"Behind the voice and text door you can pick a different voice, tune its pitch, and make this text larger or smaller. Every voice comes from your own phone, so nothing you paste ever leaves this device. There is no account, no cloud, and it keeps working in airplane mode.",
"When you want a new tape, press the new key and drop your text in. Your tapes wait in the tape box, and each one remembers where you stopped.",
"That is the whole machine. Make your first tape, press play, and let your phone do the reading."
].join('\n\n');

(function boot(){
  if(!('speechSynthesis' in window)){
    toast('THIS BROWSER HAS NO SPEECH ENGINE');
  }
  if(!docs.length){
    const seg=segment(WELCOME_TEXT);
    const doc={id:'welcome',title:'How this player works',text:WELCOME_TEXT,pos:0,
               sentCount:seg.sentences.length,createdAt:Date.now(),updatedAt:Date.now()};
    docs.push(doc); store.save(LS_DOCS,docs);
    currentId=doc.id;
  }
  const cur=docs.find(d=>d.id===currentId)||docs[0];
  if(cur) player.loadDoc(cur); else showEmpty();
})();

/* pause speech when leaving so it doesn't zombie on */
window.addEventListener('pagehide',()=>{ if(player.playing) player.pause(); });

/* desktop Chrome pauses long remote-voice speech after ~15s; nudge it along */
setInterval(()=>{ if(player.playing&&synth.speaking&&!synth.paused){ try{synth.resume();}catch(e){} } },10000);

/* ---------- service worker ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
